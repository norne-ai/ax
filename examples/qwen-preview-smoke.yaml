# Plumbing smoke test for preview hostnames. No git repo, no app, no build:
# a toy HTTP server answers on 3000 and the Web Shell runs beside it, so the
# only thing this exercises is hostname routing through dashboard -> router ->
# runner -> preview mux. Apply it, then:
#
#   http://<this-name>.norne/            the Web Shell
#   http://preview-<this-name>.norne/    the toy app
#
# Do not name this task preview-*: its own hostname would then start with the
# prefix and route entirely to the app, leaving the Shell unreachable by name.
#
# The Shell's preview panel opens on its own at the preview hostname (it asks
# /__qwen-preview.json on its own origin, which the mux answers), which is the
# case a /preview path on the Shell's own hostname can never satisfy - the panel
# refuses its own origin. Requires the browser to resolve *.norne via
# 192.168.1.73 (see apps/norne-dns), or the .norne.app hostnames through the
# tunnel and Cloudflare Access.

apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: mux-smoke-ws
  atespace: default
spec:
  git: []
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: mux-smoke
  atespace: default
spec:
  image: "localhost:5001/ax-qwen-task-runner@sha256:50d5d3ea4a3a244f02b547197fc4d0e8b1223f1f7e8cd616006eb387d5534170"
  command:
    - /bin/sh
    - -c
    - |
      node -e '
        const http = require("node:http");
        const server = http.createServer((req, res) => {
          res.writeHead(200, { "content-type": "text/html; charset=utf-8" });
          res.end(
            `<!doctype html><meta charset=utf-8><body style="font:16px system-ui;padding:3rem">` +
            `<h1>preview hostname route works</h1>` +
            `<p>host <b>${req.headers.host}</b></p><p>path <b>${req.url}</b></p>` +
            `<p>cookie <b>${req.headers.cookie || "(none)"}</b></p>`);
        });
        server.on("upgrade", (req, socket) => {
          socket.write("HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: upgrade\r\n\r\n");
          socket.end();
        });
        server.listen(3000, "0.0.0.0", () => console.log("toy preview app on 3000"));
      ' &
      exec /usr/local/bin/ax-qwen-serve
  env:
    - name: AX_PREVIEW_TARGET
      value: "http://127.0.0.1:3000"
    - name: AX_QWEN_PROMPT
      value: >-
        This is a routing smoke test. Do not edit files, do not install
        dependencies, do not start any server. Confirm only that an HTTP request
        to http://127.0.0.1:3000/ returns a page, report the status code, and stop.
    - name: OPENAI_MODEL
      value: "qwen3.8-27b"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  workspaces:
    - name: mux-smoke-ws
      path: "/workspace"
  debug: true
