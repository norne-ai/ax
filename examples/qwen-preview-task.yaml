# Preview an app the agent is building, on a hostname of its own.
#
# The atenet router only ever reaches a task on port 80, and the AX runner
# forwards that single port to exactly one target, so an app cannot get its own
# port. Set AX_PREVIEW_TARGET to the dev server's loopback address and the
# entrypoint puts the preview mux in front of the daemon, which then splits by
# hostname:
#
#   https://<task-name>.norne.app/            Qwen Web Shell
#   https://preview-<task-name>.norne.app/    the app
#
# Both hostnames route to the same actor; the mux tells them apart by the
# browser-visible Host the dashboard preserves. The prefix has to be a separate
# hostname rather than a path because the Web Shell's preview panel refuses to
# embed its own origin, and scheme+host+port is the origin. Serving the app from
# / on its own hostname is what keeps this usable: no basePath, no assetPrefix,
# no rewritten HMR socket, and absolute /_next URLs just work.
#
# The app must bind non-loopback (next dev -H 0.0.0.0 -p 3000) because the mux
# dials it from the container's loopback, and Next 15.3+ otherwise rejects
# dev requests whose Origin does not match its Host. Here they do match
# (preview-<task> on both sides), so no allowedDevOrigins entry is needed.
#
# Opening the Web Shell hostname is then enough to see the app: the shell asks
# its own origin for /__qwen-preview.json and the mux answers with the preview
# hostname, so the Web preview panel opens on its own with the address filled
# in. The scheme comes from the page that asked, because the runner's mTLS hop rewrites
# X-Forwarded-Proto and the mux cannot see what the browser actually used. Hot
# reload keeps working inside the panel because upgrades are piped to the app.
# This needs a runner image carrying both the forked shell and the mux; on an
# older image the task simply shows the empty panel.
#
# Optional env for the mux, all read from the Task's spec.env:
#   AX_PREVIEW_URL           the full address published at /__qwen-preview.json.
#                            Set it when the public name or scheme differs from
#                            preview- plus the incoming Host and the address is
#                            valid from every zone used to open the Shell. The
#                            launcher deliberately leaves this unset so LAN HTTP
#                            and tunnel HTTPS both mirror the Shell's scheme.
#   AX_PREVIEW_HOST_PREFIX   default "preview-"; "" falls back to path routing
#   AX_PREVIEW_BASE          default "/preview"; the path route, kept as a
#                            fallback for a tab or "Open externally" when a
#                            hostname is unavailable. Under the path route the
#                            app must serve itself under this base path.
#
# Caveats worth knowing before you chase a bug: the router cuts a non-upgraded
# HTTP response at 10s, so a cold on-demand compile can look like a 504 until the
# route is warm; upgrades (HMR) are exempt. And a task name plus the 8-character
# prefix must still fit one 63-character DNS label, which is why the dashboard
# only reports previewURL for names that fit.

apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: preview-workspace
  atespace: default
spec:
  git:
    - name: app
      repo: "https://github.com/OWNER/REPO.git"
      branch: main
      dir: app
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  # Single lowercase DNS label, at most 55 characters so preview- still fits.
  # This name becomes both hostnames the task is reachable on.
  name: preview-demo
  atespace: default
spec:
  image: "localhost:5001/ax-qwen-task-runner@sha256:2f6a95d84435706a174e5e097443d8394d2e1898c4b2c03faacf75af6329bfb5"
  command:
    - /usr/local/bin/ax-qwen-serve
  env:
    - name: AX_QWEN_PROMPT
      value: >-
        In /workspace/app, install dependencies and start the Next.js dev server
        in the background, bound to all interfaces:
        NEXT_TELEMETRY_DISABLED=1 npx next dev -H 0.0.0.0 -p 3000. Do not stop
        the server. Before reporting anything as working, confirm that a request
        to http://127.0.0.1:3000/ returns the app.
    - name: AX_PREVIEW_TARGET
      value: "http://127.0.0.1:3000"
    # The local NInfer endpoint and its placeholder key are baked into the image;
    # only the model is named here. See examples/qwen-task.yaml for the
    # Model Studio profile, whose key comes from spec.secretEnv instead.
    - name: OPENAI_MODEL
      value: "qwen3.8-27b"
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  workspaces:
    - name: preview-workspace
      path: "/workspace"
  debug: true
