apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: qwen-workspace
  atespace: default
spec:
  git: []
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: qwen-local
  atespace: default
spec:
  image: "localhost:5001/ax-qwen-task-runner@sha256:e3cfbad0400fbbfd394e1208b67e990380e0a63ba2c21437d80a11db132cc922"
  command:
    - /usr/local/bin/ax-qwen-serve
  env:
    - name: AX_QWEN_PROMPT
      value: "Inspect this workspace, complete the requested coding task, and verify your work."
    # These defaults are already baked into the image. Both AX and Hermes use
    # the shared in-cluster Service backed by the single host NInfer process.
    - name: OPENAI_API_KEY
      value: "ollama"
    - name: OPENAI_BASE_URL
      value: "http://ninfer.hermes-agent.svc.cluster.local:8000/v1"
    - name: OPENAI_MODEL
      value: "qwen3.8-27b"
    # To run the same task on Alibaba Model Studio, load the Model Studio
    # profile and name the model; the profile carries each model's endpoint, so
    # OPENAI_BASE_URL is not needed. The API key comes from a Kubernetes Secret,
    # never from this file. scripts/run-qwen-task.sh -m qwen3.8-max emits both.
    #
    #   env:
    #     - name: QWEN_CODE_SYSTEM_SETTINGS_PATH
    #       value: "/etc/qwen-code/settings-modelstudio.json"
    #     - name: OPENAI_MODEL
    #       value: "qwen3.8-max"
    #   secretEnv:
    #     - name: MODELSTUDIO_API_KEY
    #       secretKeyRef:
    #         name: modelstudio-api
    #         key: api-key
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  workspaces:
    - name: qwen-workspace
      path: "/workspace"
  debug: true
